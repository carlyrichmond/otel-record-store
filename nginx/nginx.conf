events {}

http {

  # The collector is a sibling service on the compose network
  upstream otel_collector {
    server otel-collector:4318;
  }

  server {

    listen 8123;

    # OTLP/HTTP signal endpoints, proxied to the collector with CORS headers so
    # the browser SDK running on localhost:4173 can export directly
    location ~ ^/v1/(traces|metrics|logs)$ {
      proxy_pass http://otel_collector;

      # Apply CORS headers to ALL responses, including POST
      add_header 'Access-Control-Allow-Origin' 'http://localhost:4173' always;
      add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      # Preflight requests receive a 204 No Content response
      if ($request_method = OPTIONS) {
        return 204;
      }
    }
  }
}
